# Dependency updates. Note: workflow actions are SHA-pinned (supply-chain
# policy — see the `# tag` comments in .github/workflows/); dependabot does
# not track SHA pins, so refresh those deliberately every few months:
#   curl -s https://api.github.com/repos/<owner>/<action>/git/ref/tags/<tag>
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # @types/node must track the CI/build runtime (Node 22) — a newer major
      # would typecheck against APIs the runtime doesn't have. Revisit when
      # the runtime itself moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
