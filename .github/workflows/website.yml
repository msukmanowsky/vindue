name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      # MDX drift gate: the endpoint pages are generated from the committed
      # OpenAPI spec. Regenerate and fail on any diff — deploys can't ship
      # reference pages that diverge from the spec (and thus the code).
      - name: Render endpoint pages + MDX drift gate
        run: |
          npm run clean-api-docs -- vindue
          npm run gen-api-docs -- vindue
          if ! git diff --exit-code -- docs/reference/http-api; then
            echo "::error::Generated API reference pages are stale — run 'npm run docs:all' and commit the result."
            exit 1
          fi
        working-directory: website

      - name: Build site
        run: npm run build
        working-directory: website

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
