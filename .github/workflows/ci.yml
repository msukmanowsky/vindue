name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Path awareness keeps docs-only pushes off the ~15-minute cargo gate and
  # app-only pushes off a needless site rebuild/redeploy. Workflow changes
  # count as "app" (they match '!website/**') so CI validates itself.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.filter.outputs.app }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            website:
              - 'website/**'
            app:
              - '!website/**'

  check:
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci

      # tsc + vite build (frontend type check)
      - run: npm run build

      - run: npx vitest run

      - run: cargo fmt --check
        working-directory: src-tauri

      - run: cargo clippy -- -D warnings
        working-directory: src-tauri

      - run: cargo test
        working-directory: src-tauri

      # Docs drift gate: the committed OpenAPI spec + MCP tool catalog are
      # generated from the code (utoipa annotations + the rmcp router).
      # Regenerate and fail on any diff — the human docs cannot silently
      # diverge from the API surface.
      - run: cargo run --quiet --bin docgen
        working-directory: src-tauri

      - name: Docs drift gate (generated JSON)
        run: |
          if ! git diff --exit-code -- website/docs/reference/generated; then
            echo "::error::Generated API docs are stale — run 'npm run docs:all' and commit the result."
            exit 1
          fi

  website:
    needs: [changes, check]
    # The site only builds/deploys AFTER `check` passes: a red drift gate
    # means code and committed docs disagree, and that state must never
    # publish. `always()` + explicit results because `check` legitimately
    # SKIPS on website-only pushes (skipped needs would otherwise skip this).
    if: >
      always() &&
      (needs.changes.outputs.website == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.check.result == 'success' || needs.check.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      # MDX drift gate: the endpoint pages are generated from the committed
      # OpenAPI spec. Regenerate and fail on any diff — deploys can't ship
      # reference pages that diverge from the spec (and thus the code).
      - name: Render endpoint pages + MDX drift gate
        run: |
          npm run clean-api-docs -- vindue
          npm run gen-api-docs -- vindue
          if ! git diff --exit-code -- docs/reference/http-api; then
            echo "::error::Generated API reference pages are stale — run 'npm run docs:all' and commit the result."
            exit 1
          fi
        working-directory: website

      - name: Build site
        run: npm run build
        working-directory: website

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

  deploy:
    needs: website
    # `always()` + explicit results, same reason as `website`: on docs-only
    # pushes `check` is skipped, and GitHub's implicit needs gate propagates
    # that skipped ancestor down the chain even though `website` succeeded.
    if: >
      always() &&
      needs.website.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
