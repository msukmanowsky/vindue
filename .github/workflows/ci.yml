name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # tsc + vite build (frontend type check)
      - run: npm run build

      - run: npx vitest run

      - run: cargo fmt --check
        working-directory: src-tauri

      - run: cargo clippy -- -D warnings
        working-directory: src-tauri

      - run: cargo test
        working-directory: src-tauri

      # Docs drift gate: the committed OpenAPI spec + MCP tool catalog are
      # generated from the code (utoipa annotations + the rmcp router).
      # Regenerate and fail on any diff — the human docs cannot silently
      # diverge from the API surface.
      - run: cargo run --quiet --bin docgen
        working-directory: src-tauri

      - name: Docs drift gate (generated JSON)
        run: |
          if ! git diff --exit-code -- website/docs/reference/generated; then
            echo "::error::Generated API docs are stale — run 'npm run docs:all' and commit the result."
            exit 1
          fi
