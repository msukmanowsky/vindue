name: Feature request
description: Suggest an idea for Vindue
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow or pain point, not the implementation.
      placeholder: When I unplug my monitor, pinned shortcuts land on the wrong display…
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Sketch the UX, API shape, or behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, or how other window managers handle this.
  - type: dropdown
    id: surface
    attributes:
      label: Which surface does this affect?
      multiple: true
      options:
        - Panel / tiling UX
        - Settings window
        - Keyboard shortcuts
        - HTTP API
        - MCP server
        - Config file
        - Other
