name: Bug report
description: Something isn't working in Vindue
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and the exact steps to reproduce it.
      placeholder: Pressed ⌥Space, dragged a 3×2 selection, window snapped to the wrong monitor…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "e.g. 15.6 (24G84)"
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Chip
      options:
        - Apple Silicon
        - Intel
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install Vindue?
      options:
        - DMG from GitHub Releases
        - Built from source
    validations:
      required: true
  - type: input
    id: displays
    attributes:
      label: Display setup
      description: How many displays, and any unusual arrangement (vertical stacking, mixed DPI, TV/projector)?
      placeholder: "e.g. 2× — built-in Retina + Dell U2723QE, side by side"
  - type: checkboxes
    id: ax-granted
    attributes:
      label: Accessibility permission
      description: System Settings → Privacy & Security → Accessibility
      options:
        - label: Vindue is listed AND toggled on
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: >-
        From `~/Library/Logs/com.oddinteractive.vindue/Vindue.log` — paste the
        lines around when the bug happened. If a window move failed, also paste
        the **exact error text** Vindue showed and the output of
        `curl -s 127.0.0.1:47725/api/v1/state | jq '{axTrusted, target}'`.
      render: text
  - type: textarea
    id: config
    attributes:
      label: Config (optional)
      description: From `~/Library/Application Support/com.oddinteractive.vindue/config.json`, if relevant (grid size, shortcuts).
      render: json
